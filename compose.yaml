name: zahid-ecommerce

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_NAME: E-commerce Platform
      APP_ENV: local
      APP_KEY: "${APP_KEY:?Generate .env.docker using the README first}"
      APP_DEBUG: "false"
      APP_URL: "http://127.0.0.1:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ecommerce_platform
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: "${DB_PASSWORD:?Generate .env.docker using the README first}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      SESSION_ENCRYPT: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ecommerce_platform
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: "${DB_PASSWORD:?Generate .env.docker using the README first}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Generate .env.docker using the README first}"
      MYSQL_ROOT_HOST: localhost
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/ecommerce_platform.sql:/docker-entrypoint-initdb.d/01-ecommerce.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" --silent --execute 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s

volumes:
  mysql_data:
  app_storage:
